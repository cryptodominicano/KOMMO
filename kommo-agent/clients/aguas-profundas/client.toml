# Client pack: Aguas Profundas RD
# The engine reads this. Nothing here is code; nothing in app/ is client-specific.

[client]
id            = "aguas-profundas"
name          = "Aguas Profundas RD"
language      = "es-DO"
qdrant_collection = "aguas_profundas_kb"

[kommo]
subdomain = "infoswecinvestmentscom"
# VERIFIED live 2026-07-17: WhatsApp Business API origin is "waba".
# Kommo's docs only ever show "telegram". The wrong value silently drops every message.
origin    = "waba"
# Handoff visibility: on handoff the lead moves to this pipeline stage so the
# Kommo board shows who is waiting on a human. Created 2026-07-18.
handoff_status_id = 109168423   # "Atención humana" in pipeline 14130431

[messages]
# Sent verbatim when a GPS pin arrives. Handled in code, never by the model,
# because the model paraphrases verbatim text (proven on Botpress + Respond.io).
location_received = """¡Gracias! 🙏 Recibimos su ubicación.

Ahora un técnico le enviará por aquí una imagen (mapa satelital) de su propiedad. Cuando la reciba, por favor:
1️⃣ Tome una captura de pantalla de esa imagen.
2️⃣ Ábrala y toque el ícono de editar/lápiz ✏️ de WhatsApp.
3️⃣ Dibuje los límites (linderos) de su terreno sobre el mapa.
4️⃣ Envíenos de vuelta la imagen ya marcada.

Con eso identificamos sus linderos y las posibles venas de agua para recomendarle el mejor punto de perforación. Uno de nuestros representantes continuará con su caso en breve.

Mientras tanto, ¿tiene alguna otra pregunta? Con gusto le respondo. 🙏"""

audio_unclear = "Disculpe, no logré escuchar bien su nota de voz 🙏 ¿Podría repetirla o escribirme el mensaje?"

# Sent verbatim when the customer sends a photo/file (typically a deposit
# receipt - "envíe el comprobante"). Handled in CODE, never by the model:
# business rule is NEVER confirm a payment. Acknowledge, hand off, go silent.
media_received = "¡Recibido! Gracias 🙏 Un miembro de nuestro equipo verifica su comprobante y un representante le contactará en un día laborable para coordinar los siguientes pasos."
handoff_task_text = "Un cliente espera atención humana en WhatsApp. Por favor continúe la conversación."
linderos_invite = """¡Gracias! 🙏 Recibimos su ubicación.

Para marcar los límites (linderos) de su terreno de forma fácil, abra este enlace desde su teléfono y toque las esquinas de su propiedad sobre el mapa satelital. Al terminar, toque Enviar y vuelva a este chat para completar su reserva. Si tiene alguna pregunta, escríbame por aquí. 🙏"""

[behavior]
# message_type values that trigger the deterministic location handoff
location_types = ["location"]
# message_type values treated as voice notes
audio_types    = ["voice", "audio"]
# Inbound media the agent must acknowledge + hand off rather than ignore.
# A customer sending a deposit receipt arrives as "picture" with EMPTY text -
# without this the agent silently ghosts them at the moment money changes hands.
media_types    = ["picture", "file", "video", "sticker", "contact"]
# model emits this sentinel; engine strips it and pauses the agent in code
handoff_marker = "[[HANDOFF]]"
# Graceful return after handoff. The agent stays silent only while a HUMAN
# agent (author_type=internal in Kommo) has replied within this many minutes.
# If no human has spoken, OR the last human message is older than this, the
# agent resumes and answers - so a customer with more questions is never left
# stranded because a técnico was slow or stepped away. Kommo does NOT webhook
# outgoing messages, so human activity is read from history (free of quota).
handoff_grace_minutes = 20
# On handoff, create a Kommo TASK so a human is actively pinged (not just an
# unanswered chat). Due window matches the KB promise of "within 2 business
# hours". The 15-min grace above (bot resume) and this 2h task (human SLA) are
# deliberately different timers.
handoff_task_user_id  = 15589135   # Sheyla (answers WhatsApp)
handoff_task_due_hours = 2

[salesbot]
# THE IMAGE WORKAROUND.
# Kommo's send_message is text-only, but a Salesbot Message step CAN attach
# images. Build the bot once in the UI (attach the septico photos); the agent
# emits a sentinel and the engine fires POST /bots/{id}/run for the lead.
# Fill bot_id from GET /api/v4/bots after building it.
#
# EVERY bot here MUST have an EMPTY Triggers panel in the Kommo UI. Kommo
# silently defaults new Salesbots to "Any new conversation"; left in place it
# fires at every inbound first-message and races this agent. Delete it.

# Fired deterministically by the engine on first contact - NOT by the model.
# Not in [salesbot.triggers] precisely because no sentinel should reach it.
welcome_bot_id = 55340   # "welcome-bot": the saludo as an infographic.

# DEPOSIT / BANK DETAILS. Fired deterministically by the engine when the
# septico order message goes out - NOT by a model sentinel.
#
# WHY CODE AND NOT A SENTINEL: sentinel firing measured ~80-90%. A miss here
# means the customer is told "le comparto los datos" and no photo arrives, at
# the exact moment they are trying to pay. The model decides WHETHER to send
# the order message (judgement); the bank photo riding along with it is a RULE.
#
# The bank account + cedula live ONLY in the image inside this Kommo Salesbot.
# They are never in this repo, the prompt, the KB, or any log line.
deposit_bot_id = 55956   # "banco-foto": 1 Message step, bank image, NO trigger.
# If this exact text appears in a reply, the engine fires deposit_bot_id.
# Must stay in sync with the order message in prompts/system.md.
deposit_trigger_text = "le comparto los datos para el depósito"

[salesbot.triggers]
"[[FOTOS_SEPTICO]]" = 55306  # "septico-fotos": 3 Message steps, 1 photo each, NO trigger.
"[[FOTO_AGUA]]"     = 55348  # "agua-foto": the 5-step water process infographic.

[linderos]
# Where the finished, marked parcel is delivered.
owner_email = "isaias@inteliard.com"           # TESTING - revert to Sheyla before go-live
from_email  = "Aguas Profundas <property-lines-submissions@goldcoastai.pro>"
received_message = "¡Recibimos los límites de su terreno! ✅ El siguiente paso es iniciar su estudio de agua. ¿Desea comenzar ahora? Con gusto le explico el primer paso. 🙏"
email_brand  = "Tres Golpes"
email_footer = "Gold Coast AI Automations"

[assets]
# Hosted in this repo - NOT on a platform CDN. Botpress's CDN died with the
# platform and ImgBB is a free host; both are assets we do not control.
# jsDelivr serves these with a correct image content-type, CDN-cached.
#
# NOTE: the agent CANNOT send these yet. Kommo's send_message is text-only
# ("file uploads in an upcoming release"). Staged for when that ships.
base_url = "https://cdn.jsdelivr.net/gh/cryptodominicano/KOMMO@main/kommo-agent/clients/aguas-profundas/assets"
welcome  = "https://cdn.jsdelivr.net/gh/cryptodominicano/KOMMO@main/kommo-agent/clients/aguas-profundas/assets/welcome-todo-comienza.jpg"
agua     = "https://cdn.jsdelivr.net/gh/cryptodominicano/KOMMO@main/kommo-agent/clients/aguas-profundas/assets/agua-pasos-proceso.jpg"
septico  = [
  "https://cdn.jsdelivr.net/gh/cryptodominicano/KOMMO@main/kommo-agent/clients/aguas-profundas/assets/septico-promo-1.jpg",
  "https://cdn.jsdelivr.net/gh/cryptodominicano/KOMMO@main/kommo-agent/clients/aguas-profundas/assets/septico-promo-2.jpg",
  "https://cdn.jsdelivr.net/gh/cryptodominicano/KOMMO@main/kommo-agent/clients/aguas-profundas/assets/septico-promo-3.jpg",
]
